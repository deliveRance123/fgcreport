services:
  - type: web
    name: fgcreport-web
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 10000
      - key: RENDER
        value: "true"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: SESSION_SECRET
        sync: false  # Set a fixed value in the Render dashboard — NEVER use generateValue (rotates every deploy → breaks sessions)
      - key: DATABASE_URL
        sync: false  # Allows connecting to Neon PostgreSQL cloud database seamlessly
      - key: APP_BASE_URL
        value: "https://fgcreport.onrender.com"

databases:
  - name: fgcreport-db
    plan: free
    region: oregon
    databaseName: foursquare_reports
    user: fgcreport_user
