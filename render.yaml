services:
  - type: web
    name: fgcreport-web
    runtime: docker
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: fgcreport-db
          property: connectionString

databases:
  - name: fgcreport-db
    plan: free
    region: oregon
    databaseName: foursquare_reports
    user: postgres
