services:
  - type: web
    name: fgcreport-web
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 10000
      - key: RENDER
        value: "true"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: fgcreport-db
          property: connectionString
      - key: APP_BASE_URL
        value: "https://fgcreport.onrender.com"

databases:
  - name: fgcreport-db
    plan: free
    region: oregon
    databaseName: foursquare_reports
    user: fgcreport_user
