<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register a Church — Foursquare Reports</title>
<link rel="icon" type="image/jpeg" href="/assets/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100svh;
    background: #0D0826;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 70px 16px 50px;
    position: relative;
    overflow-y: auto;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 65% 50% at 15% 15%, rgba(227,30,36,0.18) 0%, transparent 60%),
      radial-gradient(ellipse 55% 65% at 85% 85%, rgba(99,60,180,0.22) 0%, transparent 60%);
    pointer-events: none;
  }
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(255,255,255,0.02) 39px, rgba(255,255,255,0.02) 40px),
      repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(255,255,255,0.02) 39px, rgba(255,255,255,0.02) 40px);
    pointer-events: none;
  }
  .auth-topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 32px;
    z-index: 10;
  }
  .auth-back-link {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 13px;
    font-weight: 500;
    color: rgba(255,255,255,0.75);
    text-decoration: none;
    transition: all 0.15s ease;
    border: 1px solid rgba(255,255,255,0.12);
    padding: 8px 18px;
    border-radius: 99px;
    backdrop-filter: blur(12px);
    background: rgba(255,255,255,0.06);
  }
  .auth-back-link:hover {
    color: #fff;
    background: rgba(255,255,255,0.14);
    border-color: rgba(255,255,255,0.28);
  }
  .auth-card {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 640px;
    background: #FFFFFF;
    border-radius: 24px;
    padding: 44px 48px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.45);
  }
  .badge-tag {
    color: #E31E24;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 8px;
    display: block;
  }
  .auth-title {
    font-family: 'Outfit', sans-serif;
    font-size: 26px;
    font-weight: 800;
    color: #1A1040;
    margin-bottom: 6px;
    line-height: 1.2;
  }
  .auth-desc {
    font-size: 13.5px;
    color: #6B7280;
    line-height: 1.5;
    margin-bottom: 24px;
  }
  .section-label {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #1F2937;
    margin-top: 24px;
    margin-bottom: 12px;
    display: block;
  }
  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px 16px;
  }
  .field-group {
    display: flex;
    flex-direction: column;
  }
  .field-group.full {
    grid-column: 1 / -1;
  }
  .field-label {
    font-size: 12.5px;
    font-weight: 600;
    color: #374151;
    margin-bottom: 6px;
    display: block;
  }
  .field-label span.req {
    color: #E31E24;
  }
  .field-input, .field-select {
    width: 100%;
    padding: 11px 14px;
    border: 1.5px solid #E5E7EB;
    border-radius: 8px;
    font-size: 13.5px;
    color: #111827;
    background: #F9FAFB;
    transition: all 0.15s ease;
    outline: none;
    font-family: inherit;
  }
  .field-input:focus, .field-select:focus {
    border-color: #E31E24;
    background: #FFFFFF;
    box-shadow: 0 0 0 3px rgba(227,30,36,0.08);
  }
  .field-input::placeholder {
    color: #9CA3AF;
  }
  .btn-submit-container {
    display: flex;
    justify-content: flex-end;
    margin-top: 28px;
  }
  .submit-btn {
    background: #E31E24;
    color: #FFFFFF;
    border: none;
    border-radius: 8px;
    padding: 12px 28px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    box-shadow: 0 4px 14px rgba(227,30,36,0.35);
    transition: all 0.15s ease;
  }
  .submit-btn:hover {
    background: #CC161C;
    box-shadow: 0 6px 18px rgba(227,30,36,0.45);
  }
  .error-bar {
    background: #FEF2F2;
    border: 1px solid #FECACA;
    color: #DC2626;
    border-radius: 8px;
    padding: 11px 14px;
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .success-bar {
    background: #ECFDF5;
    border: 1px solid #A7F3D0;
    color: #047857;
    border-radius: 8px;
    padding: 11px 14px;
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .login-footer-link {
    text-align: center;
    margin-top: 22px;
    font-size: 13.5px;
    color: rgba(255,255,255,0.7);
    position: relative;
    z-index: 2;
  }
  .login-footer-link a {
    color: #FFFFFF;
    font-weight: 600;
    text-decoration: none;
    transition: opacity 0.15s;
  }
  .login-footer-link a:hover {
    text-decoration: underline;
    opacity: 0.9;
  }
  @media (max-width: 600px) {
    .auth-card {
      padding: 32px 20px;
      border-radius: 20px;
    }
    .form-grid {
      grid-template-columns: 1fr;
    }
    .field-group.full {
      grid-column: 1;
    }
    .btn-submit-container {
      justify-content: stretch;
    }
    .submit-btn {
      width: 100%;
    }
  }
</style>
</head>
<body>

<nav class="auth-topbar">
  <a href="/" class="auth-back-link">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    Back to home
  </a>
</nav>

<div class="auth-card">
  <span class="badge-tag">Church Registration</span>
  <h1 class="auth-title">Register Church</h1>
  <p class="auth-desc">Setup a local church and administrator account to manage monthly reports.</p>

  {% if error %}
  <div class="error-bar">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    {{ error }}
  </div>
  {% endif %}

  {% if success %}
  <div class="success-bar">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 8 12 12 14 14"/><path d="M22 12A10 10 0 1 1 12 2v10z"/></svg>
    {{ success }}
  </div>
  {% endif %}

  <form method="POST" action="/register-church">
    
    <!-- 1. CHURCH INFORMATION -->
    <span class="section-label">Church Information</span>
    <div class="form-grid">
      <div class="field-group full">
        <label class="field-label">Church Name <span class="req">*</span></label>
        <input type="text" name="church_name" class="field-input" required placeholder="e.g. FGC Grace Chapel" value="{{ form_data.get('church_name', '') }}">
      </div>
      <div class="field-group">
        <label class="field-label">District <span class="req">*</span></label>
        <input type="text" name="district" class="field-input" required placeholder="e.g. Lagos District" value="{{ form_data.get('district', '') }}">
      </div>
      <div class="field-group">
        <label class="field-label">Church Type <span class="req">*</span></label>
        <select name="church_type" class="field-select" required>
          <option value="unchartered" {% if form_data.get('church_type') == 'unchartered' %}selected{% endif %}>Unchartered Local Church</option>
          <option value="chartered" {% if form_data.get('church_type') == 'chartered' %}selected{% endif %}>Chartered Local Church</option>
        </select>
      </div>
      <div class="field-group full">
        <label class="field-label">Church Address</label>
        <input type="text" name="address" class="field-input" placeholder="Physical Address" value="{{ form_data.get('address', '') }}">
      </div>
      <div class="field-group">
        <label class="field-label">Pastor's Name</label>
        <input type="text" name="pastor_name" class="field-input" placeholder="Lead Pastor" value="{{ form_data.get('pastor_name', '') }}">
      </div>
      <div class="field-group">
        <label class="field-label">Pastor's Address</label>
        <input type="text" name="pastor_address" class="field-input" placeholder="Pastor's Residence" value="{{ form_data.get('pastor_address', '') }}">
      </div>
    </div>

    <!-- 2. ADMINISTRATOR CREDENTIALS -->
    <span class="section-label" style="margin-top: 28px;">Administrator Credentials</span>
    <div class="form-grid">
      <div class="field-group">
        <label class="field-label">Full Name <span class="req">*</span></label>
        <input type="text" name="full_name" class="field-input" required placeholder="Your full name" value="{{ form_data.get('full_name', '') }}">
      </div>
      <div class="field-group">
        <label class="field-label">Email Address (Login) <span class="req">*</span></label>
        <input type="email" name="email" class="field-input" required placeholder="pastor@gmail.com" value="{{ form_data.get('email', '') }}">
      </div>
      <div class="field-group full">
        <label class="field-label">Phone Number</label>
        <input type="text" name="phone" class="field-input" placeholder="+234..." value="{{ form_data.get('phone', '') }}">
      </div>
      <div class="field-group">
        <label class="field-label">Password <span class="req">*</span></label>
        <input type="password" name="password" class="field-input" required placeholder="........">
      </div>
      <div class="field-group">
        <label class="field-label">Confirm Password <span class="req">*</span></label>
        <input type="password" name="confirm_password" class="field-input" required placeholder="........">
      </div>
    </div>

    <div class="btn-submit-container">
      <button type="submit" class="submit-btn">Register Church</button>
    </div>
  </form>
</div>

<div class="login-footer-link">
  Already registered? <a href="/login">Sign in &rarr;</a>
</div>

</body>
</html>
