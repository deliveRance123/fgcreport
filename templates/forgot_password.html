<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — Foursquare Reports</title>
<link rel="icon" type="image/jpeg" href="/assets/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100svh; background: #0f0a2e;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 32px 16px; position: relative; overflow-y: auto;
    color: #fff;
  }
  body::before {
    content: ''; position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 60% 50% at 20% 20%, rgba(227,30,36,0.15) 0%, transparent 60%),
      radial-gradient(ellipse 50% 60% at 80% 80%, rgba(99,60,180,0.20) 0%, transparent 60%);
    pointer-events: none;
  }
  .card-container {
    position: relative; z-index: 2;
    width: 100%; max-width: 420px;
    background: #ffffff; border-radius: 20px;
    padding: 40px 40px 36px;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.08), 0 32px 80px rgba(0,0,0,0.45), 0 4px 20px rgba(0,0,0,0.25);
    color: #1A1040;
  }
  .card-logo { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; padding-bottom: 18px; border-bottom: 1px solid #F4F4F5; }
  .card-logo img { width: 42px; height: 42px; border-radius: 10px; object-fit: cover; }
  .card-logo-text .name { font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 800; color: #1A1040; display: block; line-height: 1.3; }
  .card-logo-text .sub { font-size: 10.5px; color: #A1A1AA; font-weight: 500; text-transform: uppercase; letter-spacing: .06em; }
  .auth-form-head { margin-bottom: 24px; }
  .auth-form-head h1 { font-family: 'Outfit', sans-serif; font-size: 22px; font-weight: 800; color: #1A1040; margin-bottom: 5px; }
  .auth-form-head p { font-size: 13px; color: #71717A; line-height: 1.5; }
  .field-group { margin-bottom: 18px; }
  .field-label { display: block; font-size: 12px; font-weight: 600; color: #3F3F46; margin-bottom: 6px; }
  .field-input {
    width: 100%; padding: 12px 14px;
    border: 1.5px solid #E4E4E7; border-radius: 9px;
    font-size: 13.5px; color: #0D0D12; background: #FAFAFA;
    transition: border-color 0.15s, box-shadow 0.15s; outline: none; font-family: inherit;
  }
  .field-input:focus { border-color: #E31E24; box-shadow: 0 0 0 3px rgba(227,30,36,0.10); background: #fff; }
  .submit-btn {
    width: 100%; padding: 13px; margin-top: 4px;
    background: linear-gradient(135deg, #E31E24 0%, #B81018 100%);
    color: #fff; border: none; border-radius: 9px;
    font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit;
    box-shadow: 0 4px 16px rgba(227,30,36,0.38); transition: all 0.15s;
  }
  .submit-btn:hover { box-shadow: 0 6px 22px rgba(227,30,36,0.48); opacity: 0.93; }
  .error-bar {
    background: #FEF2F2; border: 1px solid #FECACA; color: #DC2626;
    border-radius: 9px; padding: 10px 14px; font-size: 13px; font-weight: 500;
    margin-bottom: 18px; display: flex; align-items: center; gap: 8px;
  }
  .success-bar {
    background: #ECFDF5; border: 1px solid #A7F3D0; color: #059669;
    border-radius: 9px; padding: 10px 14px; font-size: 13px; font-weight: 500;
    margin-bottom: 18px; display: flex; align-items: center; gap: 8px;
  }
  .bottom-links {
    margin-top: 22px; padding-top: 18px; border-top: 1px solid #F4F4F5;
    text-align: center; font-size: 12.5px; color: #71717A;
  }
  .bottom-links a { color: #E31E24; text-decoration: none; font-weight: 600; }
  .bottom-links a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="card-container">
  <div class="card-logo">
    <img src="/assets/logo.jpg" alt="Logo" onerror="this.style.display='none'">
    <div class="card-logo-text">
      <span class="name">Foursquare Reports</span>
      <span class="sub">Account Recovery</span>
    </div>
  </div>

  <div class="auth-form-head">
    <h1>Forgot Password</h1>
    <p>Enter your registered email address to receive a 6-digit OTP and secure reset link.</p>
  </div>

  {% if error %}
  <div class="error-bar" role="alert">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    {{ error }}
  </div>
  {% endif %}

  {% if success %}
  <div class="success-bar" role="status">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
    {{ success }}
  </div>
  {% endif %}

  <form method="POST" action="/forgot-password">
    <div class="field-group">
      <label class="field-label" for="email">Registered Email Address</label>
      <input type="email" id="email" name="email" class="field-input" required
             placeholder="e.g. pastor@foursquare.org" value="{{ email or '' }}">
    </div>

    <button type="submit" class="submit-btn">Send OTP & Reset Link</button>
  </form>

  <div class="bottom-links">
    Remembered your credentials? <a href="/login">Back to Login</a>
  </div>
</div>

</body>
</html>
